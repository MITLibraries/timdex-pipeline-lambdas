name: Prod Image Promote
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    name: Prod promote
    uses: mitlibraries/.github/.github/workflows/ecr-multi-arch-promote-prod.yml@main
    secrets: inherit
    with:
      AWS_REGION: us-east-1
      GHA_ROLE_STAGE: timdex-pipeline-lambdas-gha-stage
      GHA_ROLE_PROD: timdex-pipeline-lambdas-gha-prod
      ECR_STAGE: timdex-pipeline-lambdas-stage
      ECR_PROD: timdex-pipeline-lambdas-prod
      # Custom function name preserved; this repo deploys the timdex-format lambda.
      FUNCTION: timdex-format-prod
